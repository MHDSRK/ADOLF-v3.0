<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">ADOLF v3.0 mark</title>
  <desc id="desc">The ADOLF v3.0 cyan inner logo on a transparent background.</desc>
  <defs>
    <filter id="cyan-mark" color-interpolation-filters="sRGB">
      <feColorMatrix in="SourceGraphic" type="matrix" values="
        0 0 0 0 0.4509804
        0 0 0 0 0.9529412
        0 0 0 0 1
        0.2126 0.7152 0.0722 0 -0.12" result="cyan"/>
      <feComponentTransfer in="cyan">
        <feFuncA type="linear" slope="1.5" intercept="-0.05"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <image href="/adolf-v3-logo.svg" x="0" y="0" width="1024" height="1024" filter="url(#cyan-mark)"/>
</svg>